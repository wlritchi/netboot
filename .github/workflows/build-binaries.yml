name: Build Binaries

on:
  push:
    branches: [main]
    paths:
      - 'third_party/ipxe/**'
      - 'third_party/edk2/**'
      - 'third_party/edk2-platforms/**'
      - 'third_party/edk2-non-osi/**'
      - 'pixiecore/boot.ipxe'
      - 'Makefile'
      - '.github/workflows/build-binaries.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build iPXE binaries
        run: |
          make docker-update-ipxe
          sudo chown -R $(id -u):$(id -g) ${{ github.workspace }}/ipxe/bin ${{ github.workspace }}/third_party/ipxe/src

      - name: Build RPi4 UEFI firmware
        run: |
          make docker-update-rpi4
          sudo chown -R $(id -u):$(id -g) ${{ github.workspace }}/rpi4/bin ${{ github.workspace }}/third_party/Build ${{ github.workspace }}/third_party/edk2/BaseTools

      - name: Display checksums
        run: |
          sha256sum ipxe/bin/*
          sha256sum rpi4/bin/*

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            ipxe/bin/ipxe-i386.efi
            ipxe/bin/ipxe.pxe
            ipxe/bin/ipxe-x64.efi
            ipxe/bin/undionly.kpxe
            ipxe/bin/snp-arm64.efi
            rpi4/bin/RPI_EFI.fd

      - name: Check for changes
        id: check_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ipxe/bin/ rpi4/bin/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in built binaries"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in built binaries"
            git diff --cached --stat
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git commit -m "Update binaries

          Built with $DOCKER_IMAGE (default: gcc:15).

          Build timestamps are derived from submodule commit times for reproducibility.
          Run 'make print-timestamps' to see the values used.

          Source commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git push
